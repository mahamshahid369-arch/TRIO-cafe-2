name: Trio Cafe CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Backend Setup ---
      - name: Setup Node.js (Backend)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      # --- AUTOMATED TESTING STAGE ---
      - name: Set up Python for Testing
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Selenium and Webdriver Manager
        run: |
          pip install selenium webdriver-manager

      - name: Run Selenium Tests
        run: python selenium_tests.py
        # This will fail the pipeline if any test in your script fails

      # --- Docker Preparation ---
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build & Push Backend ---
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            laibaafzaal98/trio-cafe-backend:latest
            laibaafzaal98/trio-cafe-backend:${{ github.sha }}

      # --- Build & Push Frontend ---
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            laibaafzaal98/trio-cafe-frontend:latest
            laibaafzaal98/trio-cafe-frontend:${{ github.sha }}

      - name: Test Docker Compose Build
        run: docker compose build