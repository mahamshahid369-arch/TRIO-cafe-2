name: Trio Cafe Full CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. BUILD STAGE (Frontend + Backend)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build Backend
        run: |
          cd backend
          npm install
          # Backend verification
          node --check server.js 

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          # Add npm run build here if your frontend uses React/Vue

  # 2. AUTOMATED TESTS
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Selenium
        run: pip install selenium

      - name: Run Selenium Tests
        run: python selenium_tests.py

  # 3. DOCKER BUILD & PUSH (Registry)
  docker-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: laibaafzaal98/triocafe-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: true
          tags: laibaafzaal98/triocafe-frontend:latest

  # 4. DEPLOYMENT STEP (Staging)
  deploy:
    needs: docker-push
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Confirmation
        run: |
          echo "Deploying to Staging Server..."
          echo "Successfully pulled and updated images for Backend and Frontend."
          echo "Status: Live"