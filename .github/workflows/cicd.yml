name: Trio Cafe CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_FRONTEND: laibaafzaal98/triocafe-frontend
  IMAGE_BACKEND:  laibaafzaal98/triocafe-backend

jobs:

  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
        working-directory: ./backend
      - run: npm test
        working-directory: ./backend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -la frontend/ && echo "✅ Frontend verified"

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: laibaafzaal98/triocafe-backend:latest
      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: laibaafzaal98/triocafe-frontend:latest

  deploy:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - run: |
          echo "🚀 Frontend → laibaafzaal98/triocafe-frontend:latest"
          echo "🚀 Backend  → laibaafzaal98/triocafe-backend:latest"
          echo "✅ Ready for AKS deployment"