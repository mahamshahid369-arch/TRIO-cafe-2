name: Trio Cafe CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project files
        run: |
          ls -la trio_cafe_Project/
          echo "✅ Trio Cafe frontend verified"

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Create Dockerfile
        run: |
          cat > Dockerfile << 'EOF'
          FROM nginx:alpine
          COPY trio_cafe_Project/ /usr/share/nginx/html/
          EXPOSE 80
          CMD ["nginx", "-g", "daemon off;"]
          EOF
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: laibaafzaal98/triocafe-frontend:latest

  deploy:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - run: |
          echo "🚀 Image pushed: laibaafzaal98/triocafe-frontend:latest"
          echo "✅ Ready for deployment"